<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Itsuki companion</title>
<link rel="stylesheet" href="widget-shared.css">
<style>
:root{--rose:var(--widget-rose);--line:var(--widget-edge);--muted:var(--widget-muted);--focus-ring:var(--widget-focus)}
.widget{padding:12px;display:grid;min-width:0;min-height:0}
.companion-layout{display:grid;grid-template-columns: minmax(0,220px) minmax(0,1fr);gap:14px;align-items:center;min-width:0;min-height:0}
.art-frame{display:grid;place-items:center;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;border:1px solid #ffffff20;border-radius:16px;background:radial-gradient(ellipse at 50% 45%,#70405070 0%,#2b1825 58%,#1d1018 100%);box-shadow:0 7px 20px #0006}
.avatar{display:block;width:100%;height:100%;min-width:0;min-height:0;object-fit:contain;object-position:center center;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 5px 10px #0007)}
.companion-copy{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-width:0;min-height:0;height:100%;padding:5px 2px}
.companion-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.companion-label{color:#f5c4ce;font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.hide{display:grid;place-items:center;flex:0 0 30px;width:30px;height:30px;border:1px solid #ffffff18;border-radius:9px;background:#ffffff0b;color:#e7d5dc;font-size:18px;cursor:pointer;-webkit-app-region:no-drag;transition:background .14s,color .14s,border-color .14s}
.hide:hover{background:#ffffff18;border-color:#f28b9c55;color:#fff}
.hide:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}
.message-wrap{display:grid;gap:9px;min-width:0}
.message-kicker{color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.message{min-width:0;max-height:116px;overflow:hidden;color:#fff0f3;font-size:14px;font-weight:620;line-height:1.58;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;overflow-wrap:anywhere;text-wrap:pretty}
.status-row{display:flex;align-items:center;gap:8px;min-width:0;padding-top:10px;border-top:1px solid #ffffff17}
.context{display:inline-flex;align-items:center;gap:7px;min-width:0;padding:6px 10px;border:1px solid #d94e6738;border-radius:999px;background:#d94e6718;color:var(--rose);font-size:9px;font-weight:850;letter-spacing:.09em}
.context:before{content:"";width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.context[data-context="sleep"]{border-color:#9c84c044;background:#9c84c01a;color:#cfbde8}
.context[data-context="wind-down"]{border-color:#f6c55544;background:#f6c55518;color:#f6d779}
.status-note{min-width:0;color:var(--muted);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-height:220px){.widget{padding:8px}.companion-layout{grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:10px}.message{font-size:12px;-webkit-line-clamp:3}.companion-copy{gap:6px}.status-row{padding-top:6px}}
</style>
</head>
<body>
<main class="widget widget-surface" aria-label="Itsuki study companion">
  <section class="companion-layout" aria-live="polite">
    <div class="art-frame">
      <img class="avatar" id="itsukiArt" alt="Itsuki expression" draggable="false">
    </div>
    <div class="companion-copy">
      <div class="companion-top">
        <span class="companion-label">Study companion</span>
        <button class="hide" id="hideItsuki" type="button" title="Hide Itsuki" aria-label="Hide Itsuki">×</button>
      </div>
      <div class="message-wrap">
        <span class="message-kicker">A little reminder</span>
        <div class="message" id="itsukiLine">Your study plan is ready. Choose one clear task and take the first step.</div>
      </div>
      <div class="status-row">
        <span class="context" id="itsukiStatus" data-context="focus">FOCUS</span>
        <span class="status-note" id="itsukiStatusNote">One step at a time</span>
      </div>
    </div>
  </section>
</main>
<script src="bridge-alias.js"></script>
<script src="itsuki.js"></script>
</body>
</html>
