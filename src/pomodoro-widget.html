<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurestar Pomodoro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font:13px/1.4 'Segoe UI',system-ui,sans-serif}
.panel{height:100%;padding:11px 13px;border:1px solid #8d5965;border-radius:18px;background:linear-gradient(145deg,#321d26f5,#1d1319f7);box-shadow:0 12px 36px #0008}
.head{display:flex;align-items:center;justify-content:space-between;height:22px}.brand{font-size:9px;letter-spacing:1.6px;font-weight:700;color:#d9a9b5}
.head button{border:0;background:#ffffff14;color:#f8e9ed;border-radius:7px;width:23px;height:23px;cursor:pointer}
.content{height:90px;display:flex;align-items:center;gap:12px}.dial{width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ce8799 0deg,#633d49 0deg);position:relative}
.dial:before{content:"";position:absolute;inset:4px;border-radius:50%;background:linear-gradient(145deg,#321d26,#1d1319)}.time{z-index:1;font-size:22px;line-height:1;font-weight:650;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.details{min-width:0;flex:1}.phase{font-size:10px;letter-spacing:1.2px;color:#d5a0ad;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{font-size:10px;color:#c7aab1;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.actions{display:flex;gap:7px;margin-top:2px}.actions button{flex:1;min-width:0;border:1px solid #80505d;background:#ffffff0d;color:#f8e9ed;border-radius:8px;padding:7px 5px;font-size:10px;cursor:pointer}.actions button.primary{background:#884a5b;border-color:#a76678;color:#fff}
</style>
</head>
<body>
<main class="panel">
  <header class="head"><span class="brand">AURESTAR · POMODORO</span><button id="close" aria-label="Close widget">×</button></header>
  <section class="content"><div class="dial" id="dial"><div class="time" id="time">25:00</div></div><div class="details"><div class="phase" id="phase">FOCUS · READY</div><div class="detail" id="detail">Round 1 of 4</div></div></section>
  <div class="actions">
    <button class="primary" id="toggle">Start</button>
    <button id="reset">Reset</button>
  </div>
</main>
<script src="bridge-alias.js"></script>
<script src="pomodoro-widget.js"></script>
</body>
</html>
