<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurestar Pomodoro</title>
<link rel="stylesheet" href="widget-shared.css">
<style>
:root{--rose:var(--widget-rose);--rose-deep:var(--widget-rose-deep);--line:var(--widget-edge);--muted:var(--widget-muted);--focus-ring:var(--widget-focus)}
html,body{font-size:12px;line-height:1.35}
.panel{padding:8px 10px;display:grid;grid-template-rows:31px 1fr;gap:6px}
.top{display:flex;align-items:center;gap:8px;min-width:0}.ring{width:28px;height:28px;flex:none;transform:rotate(-90deg)}.ring-track,.ring-progress{fill:none;stroke-width:3}.ring-track{stroke:#ffffff24}.ring-progress{stroke:var(--rose);stroke-linecap:round;stroke-dasharray:62.83;stroke-dashoffset:62.83;transition:stroke-dashoffset .18s linear}.ring-dot{fill:var(--rose);transform-box:fill-box;transform-origin:center}.running .ring-dot{animation:pulse 1.6s ease-in-out infinite}.paused .ring-dot{opacity:.65;animation:none}@keyframes pulse{50%{opacity:.45;transform:scale(.82)}}
.time{min-width:48px;font:700 16px/1 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:.01em;color:#fff7f8}.badge{min-width:0;max-width:74px;padding:4px 7px;border:1px solid #d94e6738;border-radius:999px;background:#d94e6718;color:var(--rose);font-size:9px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done .badge{border-color:#f6c55555;background:#f6c5551a;color:#f6d77f}
.bottom{display:flex;align-items:center;gap:5px;padding-top:6px;border-top:1px solid #ffffff17;-webkit-app-region:no-drag}.modes{display:flex;gap:2px;padding:2px;border:1px solid #ffffff1c;border-radius:9px;background:#0d070a;flex:none}.control,.mode{display:inline-grid;place-items:center;border:0;color:#e8d9de;cursor:pointer;transition:background .14s,color .14s,transform .14s,opacity .14s;-webkit-app-region:no-drag}.mode{width:25px;height:25px;border-radius:6px;background:transparent;font-size:10px;font-weight:800}.mode:hover,.control:hover{background:#ffffff16;color:#fff}.mode[aria-pressed="true"]{background:#8e3448;color:#ffe4e9;box-shadow:inset 0 0 0 1px #f28b9c55}.spacer{flex:1}.control{width:27px;height:27px;border-radius:8px;background:#ffffff0c;font-size:15px}.control:active,.mode:active{transform:scale(.95)}.control.primary{width:30px;background:#d94e6728;color:#ffdce2}.control.primary:hover{background:#d94e6748}.control.close{width:24px;font-size:14px;color:#bd9ba4}.control:focus-visible,.mode:focus-visible{outline:2px solid var(--focus-ring);outline-offset:1px}.control:disabled,.mode:disabled{opacity:.45;cursor:wait}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<main class="panel widget-surface idle" id="panel" aria-label="Pomodoro widget">
  <section class="top" aria-live="polite">
    <svg class="ring" viewBox="0 0 24 24" role="img" aria-label="Session progress"><circle class="ring-track" cx="12" cy="12" r="10"/><circle class="ring-progress" id="ringProgress" cx="12" cy="12" r="10"/><circle class="ring-dot" cx="12" cy="12" r="1.6"/></svg>
    <span class="time" id="time">25:00</span><span class="badge" id="phase">FOCUS</span>
  </section>
  <div class="bottom" aria-label="Timer controls">
    <div class="modes" role="group" aria-label="Pomodoro mode">
      <button class="mode" id="modeFocus" type="button" aria-label="Focus" aria-pressed="true" title="Focus">F</button>
      <button class="mode" id="modeShort" type="button" aria-label="Short Break" aria-pressed="false" title="Short Break">S</button>
      <button class="mode" id="modeLong" type="button" aria-label="Long Break" aria-pressed="false" title="Long Break">L</button>
    </div>
    <span class="spacer"></span>
    <button class="control primary" id="toggle" type="button" aria-label="Start focus" title="Start">▶</button>
    <button class="control" id="reset" type="button" aria-label="Reset timer" title="Reset">↻</button>
    <button class="control close" id="close" type="button" aria-label="Close Pomodoro widget" title="Close widget">×</button>
  </div>
  <span class="sr-only" id="detail" aria-live="polite">Round 1 of 4</span>
</main>
<script src="bridge-alias.js"></script>
<script src="pomodoro-widget.js"></script>
</body>
</html>
