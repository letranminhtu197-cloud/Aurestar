<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none';">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nhắc nhở từ Aurestar</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent;color:#fff;font:14px/1.4 "Segoe UI",system-ui,sans-serif}
    main{height:100%;display:flex;align-items:center;gap:14px;padding:18px 22px;border:1px solid #855463;border-radius:16px;background:linear-gradient(135deg,#39212bfa,#21151bf7);box-shadow:0 12px 38px #0008}
    .mark{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#885163;color:#fff;font-size:17px}
    p{margin:0;color:#f6e8ec;font-weight:600;letter-spacing:.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  </style>
</head>
<body><main><span class="mark" aria-hidden="true">✦</span><p id="message">Nhắc nhở từ Aurestar đã sẵn sàng.</p></main><script src="bridge-alias.js"></script><script src="reminder.js"></script></body>
</html>
