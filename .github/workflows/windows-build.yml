name: Windows build

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run dist:win
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke launch packaged Windows app and initialize SQLite
        shell: pwsh
        run: |
          $portable = Get-ChildItem -Path dist -Filter '*Portable*x64.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Portable Windows build was not produced.' }
          $process = Start-Process -FilePath $portable.FullName -ArgumentList @('--disable-gpu', '--remote-debugging-port=9222', '--remote-allow-origins=*') -PassThru
          $database = Join-Path (Split-Path $portable.FullName) 'AurestarData/aurestar.sqlite'
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $database)) {
            if ($process.HasExited) { throw "Aurestar exited during startup (exit code $($process.ExitCode))." }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $database)) { throw 'Aurestar did not initialize its SQLite database within 30 seconds.' }
          node scripts/smoke-electron.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Electron renderer/IPC smoke test failed.' }
          taskkill /T /F /PID $process.Id | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: aurestar-windows-installers
          path: dist/*
          if-no-files-found: error
          retention-days: 30
